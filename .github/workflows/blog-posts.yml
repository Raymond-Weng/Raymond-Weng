name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *" # 每天 08:00（台灣時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://raymondweng.dev/feed.xml"
          max_post_count: 5
